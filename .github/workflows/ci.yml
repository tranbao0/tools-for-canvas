name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Pinned, because ubuntu-latest is moving to 26.04 (design decision 13).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Tests for the build checks
        run: npm run test:scripts

      - name: Build Chrome, Edge and Firefox, then check size, URLs and manifests
        run: npm run check

      - name: Lint the Firefox build with web-ext
        run: npm run lint:webext

      - name: Package all browsers and the Firefox source zip
        run: npm run zip

      - name: Upload the Firefox build and source zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-release
          path: |
            .output/firefox-mv3/
            .output/*-sources.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser-tests:
    name: Browser tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Each value names its part and the number of parts, so a new matrix axis cannot skip tests.
        shard: ['1/3', '2/3', '3/3']
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests in Chromium
        run: npx playwright test --shard=${{ matrix.shard }}

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-visuals:
    name: Browser screenshots and gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Screenshot tests in Chromium
        id: screenshots
        # The tests check that each page renders and logs no error. They compare no pixels,
        # because fonts differ between machines. The images are for a person to review.
        run: npx playwright test tests/e2e/visual.spec.ts
        env:
          WEEKROW_VISUAL: '1'
          WEEKROW_VISUAL_OUT: screenshots

      - name: Upload the screenshots
        if: ${{ !cancelled() && steps.screenshots.conclusion != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Gallery of every surface state
        id: gallery
        # Renders every surface state from mock data at 170, 240, 360 and 480 px in light and
        # dark, and fails on any page error. The images are for a person to review.
        run: npm run test:gallery
        env:
          WEEKROW_GALLERY_OUT: gallery

      - name: Upload the gallery
        if: ${{ !cancelled() && steps.gallery.conclusion != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-visuals
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Firefox tests (${{ matrix.firefox }})
    # Every Firefox suite runs here, beside the Chromium tests, so neither job waits for the other.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firefox: [runner, minimum]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the declared minimum Firefox version
        if: matrix.firefox == 'minimum'
        id: minimum
        run: |
          npm run build:firefox
          node -e "console.log('version=' + JSON.parse(require('fs').readFileSync('.output/firefox-mv3/manifest.json')).browser_specific_settings.gecko.strict_min_version)" >> "$GITHUB_OUTPUT"

      - name: Cache the Firefox and geckodriver archives
        if: matrix.firefox == 'minimum'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/weekrow-test/archives
          key: firefox-archives-${{ steps.minimum.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/firefox/install-firefox.sh') }}

      - name: Install the minimum Firefox version
        if: matrix.firefox == 'minimum'
        env:
          WEEKROW_FIREFOX: ${{ steps.minimum.outputs.version }}
        run: |
          install_output="$(bash tests/firefox/install-firefox.sh)"
          printf '%s\n' "$install_output"
          printf '%s\n' "$install_output" | grep -E '^(FIREFOX_BIN|GECKODRIVER_BIN)=' >> "$GITHUB_ENV"

      - name: Find Firefox and geckodriver
        if: matrix.firefox == 'runner'
        # The runner image ships Firefox and geckodriver; GECKOWEBDRIVER points to the driver folder.
        run: |
          echo "FIREFOX_BIN=$(command -v firefox)" >> "$GITHUB_ENV"
          echo "GECKODRIVER_BIN=$GECKOWEBDRIVER/geckodriver" >> "$GITHUB_ENV"

      - name: Firefox smoke test
        if: ${{ !cancelled() }}
        run: npm run test:firefox

      - name: Firefox file check test
        if: ${{ !cancelled() }}
        run: npm run test:firefox:file-check

      - name: Firefox submission pages test
        if: ${{ !cancelled() }}
        run: npm run test:firefox:submission-pages

      - name: Firefox assignments preview test
        if: ${{ !cancelled() }}
        run: npm run test:firefox:assignments-preview

      - name: Firefox announcements test
        if: ${{ !cancelled() }}
        run: npm run test:firefox:announcements

      - name: Firefox People test
        if: ${{ !cancelled() }}
        run: npm run test:firefox:people

      - name: Firefox dashboard dock test
        if: ${{ !cancelled() }}
        run: npm run test:firefox:dashboard-dock

      - name: Firefox private and container tabs test
        if: ${{ !cancelled() }}
        run: npm run test:firefox:private-tabs

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Tests for the build checks
        run: npm run test:scripts

      - name: Build Chrome, Edge and Firefox, then check size, URLs and manifests
        run: npm run check

  amo-reproducible-build:
    name: Firefox Add-ons rebuild on ARM64
    # Firefox Add-ons reviewers rebuild the source zip on Ubuntu 24.04 ARM64 with Node 24.14.0 and
    # npm 11.9.0, and the result must match the uploaded build byte for byte (design decision 13).
    needs: build-and-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0

      - name: Install npm 11.9.0
        run: npm install --global npm@11.9.0

      - name: Check the tool versions
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.9.0"
          echo "Node $(node --version), npm $(npm --version), $(uname -m)"

      - name: Download the x64 Firefox build and source zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firefox-release
          path: x64

      - name: Unpack the source zip
        run: python3 -m zipfile -e x64/*-sources.zip source

      - name: Install dependencies from the lockfile
        working-directory: source
        run: npm ci

      - name: Build for Firefox Add-ons
        working-directory: source
        run: npm run build-for-amo

      - name: Compare with the x64 build byte for byte
        run: |
          diff --recursive x64/firefox-mv3 source/.output/firefox-mv3
          echo "The ARM64 rebuild matches the x64 build."
