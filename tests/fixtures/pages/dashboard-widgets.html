<script>
// Acts like React for the pagers of the paged widgets. The pager markup is the one of the
// InstUI `Pagination` (compact variant) that `TemplateWidget` renders (@instructure/ui-pagination
// 11.7.4): a nav with the arrow buttons around one list of page buttons, the current one with
// `aria-current="page"`, "…" for a skipped range, and the arrows only with more than 5 pages. A
// click on a page button draws the pager again for the new page with new nodes, after a short
// delay and with the loading spinner, as React does when the page query runs.
(function () {
  var LOAD_MS = 90;
  var SETTLE_MS = 350;

  function page(number, current) {
    return '<li style="all: unset"><button type="button" class="fx-pg-btn"' +
      (current ? ' aria-current="page"' : '') + '>' + number + '</button></li>';
  }
  function interval(from, to, current) {
    var html = '';
    for (var i = from; i <= to; i++) html += page(i, i === current);
    return html;
  }
  var GAP = '<li style="all: unset">…</li>';
  function pages(current, total) {
    if (total <= 2 || total <= 3) return interval(1, total, current);
    var html = '';
    if (current > 3) {
      html += interval(1, 1, current) + GAP;
      html += interval(current - 1, current, current);
    } else {
      html += interval(1, Math.max(current, 1), current);
    }
    if (current < total - 2) {
      html += interval(Math.max(current, 1) + 1, current + 1, current) + GAP + interval(total, total, current);
    } else {
      html += interval(current + 1, total, current);
    }
    return html;
  }
  function arrow(direction, label) {
    return '<button type="button" class="fx-pg-arrow" data-direction="' + direction + '">' +
      '<span class="fx-sr">' + label + '</span>' +
      '<svg aria-hidden="true" focusable="false" width="1em" height="1em" viewBox="0 0 1920 1920"><path d="' +
      (direction === 'prev' ? 'M1394 160 594 960l800 800' : 'M526 160l800 800-800 800') +
      '" fill="none" stroke="currentColor" stroke-width="220"/></svg></button>';
  }
  function nav(label, current, total) {
    var compact = total > 5;
    return '<nav role="navigation" aria-label="' + label + '" data-cid="Pagination" class="fx-pg">' +
      '<span class="fx-pg-pages">' +
      (compact && current > 1 ? arrow('prev', 'Previous Page') : '') +
      '<ul class="fx-pg-list">' + pages(current, total) + '</ul>' +
      (compact && current < total ? arrow('next', 'Next Page') : '') +
      '</span></nav>';
  }
  function inner(label, current, total, loading) {
    return '<div class="fx-pg-row">' +
      (loading ? '<svg role="img" aria-label="Loading" class="fx-pg-spinner" viewBox="0 0 20 20" width="20" height="20"><circle cx="10" cy="10" r="8" fill="none" stroke="#0b5cad" stroke-width="3" stroke-dasharray="30 20"/></svg>' : '') +
      nav(label, current, total) + '</div>';
  }
  window.fixturePagerHtml = inner;

  function containerOf(widgetTestId) {
    var widget = document.querySelector('[data-testid="' + widgetTestId + '"]');
    return widget && (widget.querySelector('[data-testid="pagination-container"]') ||
      widget.fxPagerContainer);
  }
  function draw(container, loading) {
    var label = container.dataset.fxLabel;
    container.innerHTML = inner(label, Number(container.dataset.fxPage), Number(container.dataset.fxTotal), loading);
  }

  // Sets the page and the total of a pager, as React draws it. A total under 2 removes the pager.
  window.fixturePager = function (widgetTestId, current, total) {
    var widget = document.querySelector('[data-testid="' + widgetTestId + '"]');
    var container = containerOf(widgetTestId);
    if (!container) return;
    container.dataset.fxPage = String(current);
    container.dataset.fxTotal = String(total);
    if (total < 2) {
      if (container.isConnected) {
        var anchor = document.createComment('fx-pager');
        container.replaceWith(anchor);
        widget.fxPagerAnchor = anchor;
        widget.fxPagerContainer = container;
      }
      return;
    }
    if (!container.isConnected && widget.fxPagerAnchor) {
      widget.fxPagerAnchor.replaceWith(container);
    }
    draw(container, false);
  };
  window.fixturePagerClicks = [];

  document.addEventListener('click', function (event) {
    var button = event.target.closest && event.target.closest('[data-testid="pagination-container"] button');
    if (!button || button.hasAttribute('aria-current')) return;
    var container = button.closest('[data-testid="pagination-container"]');
    var widget = container.closest('section[data-testid^="widget-"]');
    var current = Number(container.dataset.fxPage);
    var total = Number(container.dataset.fxTotal);
    var direction = button.dataset.direction;
    var target = direction === 'prev' ? Math.max(current - 1, 1)
      : direction === 'next' ? Math.min(current + 1, total)
      : Number(button.textContent);
    window.fixturePagerClicks.push({ widget: widget.dataset.testid, page: target, direction: direction || 'page' });
    // data-fx-busy stands for the page query that runs, and a test waits for it to end.
    container.dataset.fxBusy = 'true';
    setTimeout(function () {
      container.dataset.fxPage = String(target);
      draw(container, true);
      setTimeout(function () {
        draw(container, false);
        delete container.dataset.fxBusy;
      }, SETTLE_MS);
    }, LOAD_MS);
  });
})();
</script>
