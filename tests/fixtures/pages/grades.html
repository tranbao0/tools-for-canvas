<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Grades - fixture course</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --ic-brand-primary: #2B7ABC; --ic-link-color: #0E68B3; --ic-brand-font-color-dark: #273540; }
      body { margin: 0; font-family: "Lato Extended", Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ic-brand-font-color-dark); background: #fff; }
      a { color: var(--ic-link-color); text-decoration: none; }
      a:hover { text-decoration: underline; }
      #content { box-sizing: border-box; max-width: 1366px; margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 24px; font-size: 28px; font-weight: 400; }
      #grades_summary { width: 100%; border-collapse: collapse; font-size: 14px; }
      #grades_summary thead th { padding: 8px 12px; border-bottom: 1px solid #c7cdd1; text-align: left; font-weight: 700; }
      #grades_summary tbody th, #grades_summary tbody td { padding: 12px; border-bottom: 1px solid #e8eaec; text-align: left; vertical-align: top; }
      #grades_summary tbody th.title { font-weight: 400; }
      #grades_summary .context { color: #586874; font-size: 12px; }
      #grades_summary tr.hard_coded th, #grades_summary tr.hard_coded td { font-weight: 700; background: #f5f5f5; }
      #grades_summary tr.comments td, #grades_summary tr.rubric_assessments td { background: #fafafa; }
      #grades_summary td a + a { margin-inline-start: 12px; }
    </style>
    <script>
      INST = { environment: 'production' };
      ENV = { current_user_id: '5501', current_user_roles: ['user', 'student'] };
    </script>
  </head>
  <body>
    <!-- canvas-lms 1c9f0bb: gradebooks/grade_summary.html.erb and GradeSummaryAssignmentPresenter#classes. -->
    <main id="content">
      <h1>Grades for Student</h1>
      <table id="grades_summary">
        <thead>
          <tr><th>Name</th><th>Due</th><th>Submitted</th><th>Status</th><th>Score</th><th>Details</th></tr>
        </thead>
        <tbody>
          <tr class="student_assignment" id="submission_101" data-muted="false">
            <th class="title" scope="row"><a href="/courses/12/assignments/101/submissions/42">Essay</a><div class="context">Assignments</div></th>
            <td>Nov 3</td><td>Nov 1</td><td>Submitted</td><td>5 / 10</td>
            <td>
              <a href="#" class="toggle_rubric_assessments_link" aria-label="See rubric results" aria-controls="rubric_101" aria-expanded="false">Rubric</a>
              <a href="#" id="assignment_comment_101" class="toggle_comments_link" aria-label="Read comments" aria-expanded="false">Comments</a>
            </td>
          </tr>
          <tr id="comments_thread_101" class="comments comments_thread" hidden><td colspan="6">Canvas comments</td></tr>
          <tr id="rubric_101" class="rubric_assessments" hidden><td colspan="6">Canvas rubric</td></tr>
          <tr class="student_assignment" id="submission_102" data-muted="false">
            <th class="title" scope="row"><a href="/courses/12/assignments/102">Reading</a><div class="context">Assignments</div></th>
            <td>Nov 4</td><td></td><td></td><td>- / 10</td><td></td>
          </tr>
          <tr class="student_assignment hard_coded group_total" id="submission_group-9">
            <th class="title" scope="row">Assignments</th>
            <td></td><td></td><td></td><td>5 / 10</td><td></td>
          </tr>
          <tr class="student_assignment hard_coded final_grade" id="submission_final-grade">
            <th class="title" scope="row">Total</th>
            <td></td><td></td><td></td><td>50%</td><td></td>
          </tr>
        </tbody>
      </table>
    </main>
    <script>
      document.querySelector('.toggle_rubric_assessments_link').addEventListener('click', (event) => {
        event.preventDefault();
        const row = document.getElementById('rubric_101');
        row.hidden = !row.hidden;
        event.currentTarget.setAttribute('aria-expanded', String(!row.hidden));
      });
      document.querySelector('.toggle_comments_link').addEventListener('click', (event) => {
        event.preventDefault();
        const row = document.getElementById('comments_thread_101');
        row.hidden = !row.hidden;
        event.currentTarget.setAttribute('aria-expanded', String(!row.hidden));
      });
    </script>
  </body>
</html>
